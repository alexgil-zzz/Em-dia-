<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="em dia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="local.js"></script>

<title>em dia.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#4a2340; --plum-2:#6b3a5e; --plum-3:#8a5a7c;
  --lilac:#a99ab6; --lilac-2:#ebe5f0; --rose:#c98b95; --rose-2:#f6e7e9;
  --beige:#e9dfd0; --beige-2:#f4eee5; --off:#fbf8f3; --card:#fffdf9;
  --ink:#2f2230; --muted:#7f707d; --line:#ece3da;
  --s1:#7f3b75; --s2:#d9737f;
  --ok:#3f7d5c; --ok-2:#e6f1ea; --warn:#a86f1e; --warn-2:#f8eedc; --bad:#a8423f; --bad-2:#f7e3e1;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--off);color:var(--ink);font-family:"Jost",system-ui,sans-serif;font-size:15px;line-height:1.5;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--plum-2)}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:.01em}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
/* menu lateral */
aside{background:var(--plum);color:#f4ecf1;padding:26px 16px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.logo{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:600;font-style:italic;margin:0 10px 28px;letter-spacing:.01em;color:#fff}
.logo span{color:var(--rose)}
nav.menu button{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;color:#e8dce4;padding:11px 14px;border-radius:12px;cursor:pointer;font-size:15px;text-align:left;margin-bottom:2px}
nav.menu button svg{width:19px;height:19px;flex:0 0 19px;opacity:.85}
nav.menu button:hover{background:rgba(255,255,255,.07)}
nav.menu button.on{background:rgba(255,255,255,.13);color:#fff}
nav.menu button.on svg{opacity:1}
.side-art{margin-top:auto;opacity:.55;pointer-events:none}
.side-art svg{width:100%;height:auto;display:block}
main{padding:30px 36px 60px;max-width:1180px;width:100%;min-width:0}
/* cabeçalho de página */
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px;position:relative}
.ph h1{font-size:38px;margin:0;line-height:1.05;color:var(--plum)}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .sp{flex:1}
.ph-art{flex:0 0 auto;width:118px;margin:-14px 0 -8px}
.ph-art svg{width:100%;height:auto;display:block}
.ph-art.ph-inicio{width:210px;margin:-30px 0 -10px}
.ph-tit{min-width:0}
.ph-acoes{display:none}
.sprig{position:absolute;right:0;top:-18px;width:120px;opacity:.5;pointer-events:none}
/* sub-abas */
.subtabs{display:flex;gap:6px;flex-wrap:nowrap;margin-bottom:20px;background:var(--beige-2);padding:5px;border-radius:14px;width:fit-content;max-width:100%;overflow-x:auto}
.subtabs button{border:0;background:transparent;padding:7px 15px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.subtabs button.on{background:var(--card);color:var(--plum);box-shadow:0 1px 3px rgba(74,35,64,.08)}
/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.card h3{font-size:22px;margin:0 0 4px;color:var(--plum)}
.card .ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card .ch h3{margin:0;flex:1}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.hint{color:var(--muted);font-size:13.5px}
.big{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:600;line-height:1.1;color:var(--plum)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600;color:var(--plum);line-height:1.2}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.dark{background:var(--plum);border-color:var(--plum);color:#f2e8ee}
.kpi.dark b{color:#fff} .kpi.dark span,.kpi.dark small{color:#d9c6d3}
/* botões e campos */
.btn{border:0;border-radius:12px;padding:9px 17px;cursor:pointer;background:var(--plum);color:#fff;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.btn svg{width:16px;height:16px}
.btn.sec{background:var(--lilac-2);color:var(--plum)}
.btn.rose{background:var(--rose-2);color:#8e4552}
.btn.ghost{background:transparent;color:var(--plum-2);border:1px solid var(--line)}
.btn.warn{background:var(--bad-2);color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--beige-2);color:var(--plum)}
.icon-btn svg{width:17px;height:17px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=month],input[type=url],select,textarea{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lilac);outline-offset:0;border-color:transparent}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row > *{flex:1 1 150px}
.row > .fx{flex:0 0 auto}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14.5px}
.chk input{width:18px;height:18px;accent-color:var(--plum-2)}
/* listas */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500}
.li .s{font-size:13px;color:var(--muted)}
.val{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.val.in{color:var(--ok)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.tag.ok{background:var(--ok-2);color:var(--ok)} .tag.warn{background:var(--warn-2);color:var(--warn)} .tag.bad{background:var(--bad-2);color:var(--bad)}
.tag.neu{background:var(--beige-2);color:var(--muted)} .tag.lil{background:var(--lilac-2);color:var(--plum-2)} .tag.rose{background:var(--rose-2);color:#8e4552}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
/* progresso */
.prog{height:8px;background:var(--beige-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--rose);border-radius:99px}
.prog.plum i{background:var(--plum-2)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty svg{width:64px;opacity:.5;margin-bottom:6px}
/* mês */
.monthnav{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.monthnav b{min-width:150px;text-align:center;font-weight:500;text-transform:capitalize}
/* quadro de pendências */
.board{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:16px;overflow-x:auto}
.col{background:var(--beige-2);border-radius:var(--r);padding:12px}
.col h4{margin:4px 6px 12px;font-weight:500;font-size:14px;display:flex;justify-content:space-between;color:var(--plum-2)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.pcard:hover{border-color:var(--lilac)}
.pcard .t{font-weight:500}
/* treinos */
.ex{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff}
.ex.done{background:var(--ok-2);border-color:#cfe3d6}
.ex .img{width:92px;height:92px;border-radius:14px;background:var(--beige-2);flex:0 0 92px;overflow:hidden;display:grid;place-items:center;color:var(--lilac)}
.ex .img img{width:100%;height:100%;object-fit:cover}
.ex .img svg{width:30px}
.ex .grow{flex:1;min-width:0}
.ex input.carga{width:90px;padding:6px 8px}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--lilac);background:#fff;cursor:pointer;display:grid;place-items:center;flex:0 0 34px;color:#fff}
.check.on{background:var(--ok);border-color:var(--ok)}
.check svg{width:18px}
/* desejos */
.wish{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.wish .ph-img{height:150px;background:var(--beige-2);display:grid;place-items:center;color:var(--lilac)}
.wish .ph-img img{width:100%;height:100%;object-fit:cover}
.wish .ph-img svg{width:44px}
.wish .body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
/* cofrinhos */
.cofre{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;position:relative;overflow:hidden}
.cofre:hover{border-color:var(--lilac)}
.cofre h3{font-size:22px;margin:0;color:var(--plum)}
.cofre .pct{font-family:"Cormorant Garamond",serif;font-size:30px;color:var(--plum-2);font-weight:600}
/* gráficos */
.hbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hbar .track{height:10px;background:var(--beige-2);border-radius:0 4px 4px 0;position:relative}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:6px 10px;border-radius:8px;font-size:12.5px;z-index:80;opacity:0;transition:opacity .1s;white-space:nowrap}
/* modal e toast */
.mbg{position:fixed;inset:0;background:rgba(47,34,48,.42);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:40px 14px;overflow-y:auto}
.mbg.show{display:flex}
.modal{background:var(--card);border-radius:22px;padding:24px;max-width:480px;width:100%;box-shadow:0 20px 50px rgba(47,34,48,.2)}
.modal.lg{max-width:760px}
.modal h2{font-size:28px;margin:0 0 14px;color:var(--plum)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--plum);color:#fff;padding:10px 20px;border-radius:12px;z-index:90;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.quick button{background:var(--beige-2);border:0;border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:var(--plum);display:flex;flex-direction:column;gap:8px;font-weight:500}
.quick button:hover{background:var(--lilac-2)}
.quick svg{width:20px;height:20px}
.ex-edit{display:grid;grid-template-columns:56px 1.6fr .6fr .7fr .7fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ex-edit .thumb{width:56px;height:56px;border-radius:10px;background:var(--beige-2);overflow:hidden;display:grid;place-items:center;cursor:pointer;color:var(--lilac);position:relative}
.ex-edit .thumb img{width:100%;height:100%;object-fit:cover}
.ex-edit .thumb input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ex-edit .thumb svg{width:22px}
.cl{display:flex;align-items:center;gap:10px;padding:7px 0}
.cl.done span{text-decoration:line-through;color:var(--muted)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.libcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.libcard:hover{border-color:var(--lilac)}
.libcard .fig{background:linear-gradient(180deg,var(--off),var(--beige-2));padding:4px;aspect-ratio:1}
.libcard .fig svg,.demo svg,.ex .img svg.fg{width:100%;height:auto;display:block}
img.exi{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.semimg{width:100%;height:100%;display:grid;place-items:center;color:var(--lilac);background:var(--beige-2)}.semimg svg{width:40%;height:auto}
.libcard .fig{aspect-ratio:480/560!important;padding:0!important;background:#fff!important}
.libcard .fig img.exi{object-fit:cover}
.fx-res .th img.exi,.ex .img img.exi,.ex-edit .thumb img.exi{object-fit:cover;object-position:50% 38%}
.exfoto{display:block;width:100%;max-width:340px;margin:0 auto 12px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;padding:0;cursor:zoom-in;position:relative}
.exfoto img{width:100%;height:auto;display:block}
.exfoto span{position:absolute;right:8px;bottom:8px;background:rgba(47,34,48,.72);color:#fff;font-size:11.5px;padding:3px 9px;border-radius:999px;display:inline-flex;gap:4px;align-items:center}
.exfoto span svg{width:13px;height:13px}
.zoom{position:fixed;inset:0;background:rgba(30,20,30,.88);z-index:95;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.zoom.show{display:flex}
.zoom img{max-width:min(92vw,560px);max-height:80vh;width:auto;height:auto;border-radius:18px;background:#fff}
.libcard .nm{padding:10px 12px 12px;font-weight:500;font-size:14px;line-height:1.3}
.libcard .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.search{position:relative;flex:1 1 260px}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.demo{background:linear-gradient(180deg,var(--off),var(--beige-2));border-radius:18px;padding:8px 8px 0;margin-bottom:14px}
.demo svg{max-width:420px;margin:0 auto}
.demo2{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;background:linear-gradient(180deg,#f3ecf8,#e9def2);border-radius:18px;padding:10px;margin-bottom:14px}
.demo2 .etapa{text-align:center;border-radius:14px;padding:6px 4px 8px;transition:background .3s}
.demo2 .etapa.on{background:rgba(255,255,255,.55)}
.demo2 .fig svg{width:100%;height:auto;display:block;max-width:230px;margin:0 auto}
.demo2 .lbl{display:inline-block;margin-top:4px;background:var(--plum);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:500}
.demo2 .seta{color:var(--plum-2)}.demo2 .seta svg{width:26px;height:26px}
.musc{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px}
.fx-busca{position:relative}
.fx-res{position:static;margin-top:8px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(47,34,48,.14);max-height:320px;overflow-y:auto;margin-top:4px}
.fx-res button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;cursor:pointer;text-align:left;border-bottom:1px solid var(--line)}
.fx-res button:last-child{border-bottom:0}.fx-res button:hover{background:var(--beige-2)}
.fx-res .th{width:44px;height:44px;border-radius:10px;background:var(--beige-2);overflow:hidden;flex:0 0 44px}.fx-res .th svg{width:100%;height:100%}
.fx-res b{font-weight:500;display:block}.fx-res small{color:var(--muted)}
.histcard{display:flex;gap:12px;align-items:center}
@media (max-width:860px){.demo2{grid-template-columns:1fr auto 1fr;gap:2px;padding:6px}.demo2 .seta svg{width:18px}.demo2 .lbl{font-size:10.5px;padding:2px 7px}}
.steps{counter-reset:p;padding:0;margin:8px 0 0;list-style:none}
.steps li{counter-increment:p;position:relative;padding:4px 0 8px 34px}
.steps li::before{content:counter(p);position:absolute;left:0;top:3px;width:24px;height:24px;border-radius:50%;background:var(--lilac-2);color:var(--plum);font-size:13px;display:grid;place-items:center;font-weight:600}
.ex .img{cursor:pointer}
.ex .img svg.fg{width:100%;height:100%}
.ex-edit .thumb svg.fg{width:100%;height:100%}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .pl .sh{display:none}
.cal .dw{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:500}
.cal .d{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:84px;padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
.cal .d:hover{border-color:var(--lilac)}
.cal .d.out{opacity:.35}
.cal .d.hoje{border:2px solid var(--plum-2)}
.cal .d .n{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cal .d .n b{font-weight:500;color:var(--ink)}
.cal .pl{font-size:11.5px;line-height:1.25;padding:3px 6px;border-radius:7px;color:#fff;font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cal .pl.rest{background:var(--beige-2);color:var(--muted)}
.cal .pl.car{background:var(--lilac-2);color:var(--plum-2)}
.cal .ok{width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.cal .ok svg{width:12px}
.cal .exc{position:absolute;top:6px;right:26px;width:5px;height:5px;border-radius:50%;background:var(--rose)}
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.semana .fo{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.25;min-height:15px}
.semana .w{background:var(--beige-2);border-radius:14px;padding:10px 8px;text-align:center}
.semana .w b{display:block;font-weight:500;margin-bottom:6px;color:var(--plum)}
.semana select{font-size:13px;padding:7px 6px;border-radius:10px}
.semana .w.hoje{background:var(--lilac-2);outline:2px solid var(--plum-2)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.strip .s1{flex:0 0 auto;min-width:74px;text-align:center;border-radius:12px;padding:8px 6px;background:var(--beige-2);font-size:12.5px}
.strip .s1 b{display:block;font-weight:500;color:var(--plum);font-size:13px}
.strip .s1 i{display:block;width:8px;height:8px;border-radius:50%;margin:5px auto 3px}
@media (max-width:860px){
  .semana{grid-template-columns:1fr 1fr}

<div id="app"><div class="empty" style="padding-top:120px">carregando…</div></div>
<div id="tip"></div>
<div class="toast" id="toast"></div>
<div class="mbg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="zoom" id="zoom"></div>

<script>
// ===== figura feminina articulada (vista lateral) =====
const FIG = (() => {
  const L = { torso: 50, neck: 6, head: 9.5, thigh: 42, shin: 40, foot: 13, ua: 27, fa: 26 };
  const C = { skin: "#e6c7cc", hair: "#4a2340", top: "#c98b95", leg: "#5b2a4e", shoe: "#2f2230", eq: "#8e8499", eq2: "#4d4458", floor: "#e3d8cc" };
  const v = a => [Math.cos(a * Math.PI / 180), Math.sin(a * Math.PI / 180)];
  const add = (p, q, k = 1) => [p[0] + q[0] * k, p[1] + q[1] * k];
  const sub = (p, q) => [p[0] - q[0], p[1] - q[1]];
  const len = p => Math.hypot(p[0], p[1]);
  function ik(A, Cc, l1, l2, pref) {
    let d = sub(Cc, A); let dl = len(d);
    if (dl > l1 + l2 - 0.5) { d = [d[0] / dl * (l1 + l2 - 0.5), d[1] / dl * (l1 + l2 - 0.5)]; dl = l1 + l2 - 0.5; Cc = add(A, d); }
    if (dl < Math.abs(l1 - l2) + 0.5) dl = Math.abs(l1 - l2) + 0.5;
    const base = Math.atan2(d[1], d[0]);
    const ca = Math.max(-1, Math.min(1, (l1 * l1 + dl * dl - l2 * l2) / (2 * l1 * dl)));
    const off = Math.acos(ca);
    const j1 = add(A, [Math.cos(base + off), Math.sin(base + off)], l1), j2 = add(A, [Math.cos(base - off), Math.sin(base - off)], l1);
    const mid = add(A, d, .5);
    const s1 = (j1[0] - mid[0]) * pref[0] + (j1[1] - mid[1]) * pref[1], s2 = (j2[0] - mid[0]) * pref[0] + (j2[1] - mid[1]) * pref[1];
    return [s1 >= s2 ? j1 : j2, Cc];
  }
  function solve(p) {
    const hip = p.hip; const tv = v(p.t);
    const sh = add(hip, tv, L.torso);
    const hd = p.hd ?? p.t; const head = add(sh, v(hd), L.neck + L.head);
    const kp = p.knee || [1, -0.15], ep = p.elbow || [-0.3, 1];
    const ankF = p.ankleF || add(p.ankle, [3, -1]);
    const handF = p.handF || add(p.hand, [3, -2]);
    const [knee, ank] = ik(hip, p.ankle, L.thigh, L.shin, kp);
    const [kneeF, ankF2] = ik(add(hip, [2, -1]), ankF, L.thigh, L.shin, p.kneeF || kp);
    const [elb, hand] = ik(sh, p.hand, L.ua, L.fa, ep);
    const [elbF, handF2] = ik(add(sh, [2, -1]), handF, L.ua, L.fa, p.elbowF || ep);
    const toe = add(ank, v(p.ft ?? 0), L.foot), toeF = add(ankF2, v(p.ftF ?? p.ft ?? 0), L.foot);
    let back = [tv[1], -tv[0]]; if (p.flip) back = [-back[0], -back[1]];
    return { hip, sh, head, knee, ank, toe, kneeF, ankF: ankF2, toeF, elb, hand, elbF, handF: handF2, tv, back, hd };
  }
  const ln = (a, b, c, w, o = 1) => `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${o < 1 ? ` opacity="${o}"` : ""}/>`;
  const ci = (p, r, f, extra = "") => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${f}" ${extra}/>`;
  function props(list, J, side) {
    return (list || []).map(pr => {
      const [k, ...a] = pr; const at = n => typeof n === "string" ? J[{ ankle: "ank", ankleF: "ankF" }[n] || n] : n;
      if (k === "bar") { const p = at(a[0]); return ci(p, 10, "none", `stroke="${C.eq2}" stroke-width="2.6" opacity=".9"`) + ci(p, 2.6, C.eq2); }
      if (k === "db") { const p = at(a[0]); return ln(add(p, [-7, 0]), add(p, [7, 0]), C.eq2, 3) + `<rect x="${(p[0] - 10).toFixed(1)}" y="${(p[1] - 5).toFixed(1)}" width="5" height="10" rx="1.5" fill="${C.eq2}"/><rect x="${(p[0] + 5).toFixed(1)}" y="${(p[1] - 5).toFixed(1)}" width="5" height="10" rx="1.5" fill="${C.eq2}"/>`; }
      if (k === "kb") { const p = at(a[0]); return `<path d="M${p[0] - 5},${p[1] + 2} q5,-9 10,0" fill="none" stroke="${C.eq2}" stroke-width="2.5"/>` + ci(add(p, [0, 10]), 8, C.eq2); }
      if (k === "bench") { const [x1, x2, y] = a; return `<rect x="${x1}" y="${y}" width="${x2 - x1}" height="7" rx="3" fill="${C.eq}"/>` + ln([x1 + 6, y + 7], [x1 + 6, 182], C.eq, 3) + ln([x2 - 6, y + 7], [x2 - 6, 182], C.eq, 3); }
      if (k === "box") { const [x1, x2, y] = a; return `<rect x="${x1}" y="${y}" width="${x2 - x1}" height="${182 - y}" rx="3" fill="${C.eq}" opacity=".7"/>`; }
      if (k === "seat") { const [x1, x2, y, bx, by1, by2] = a; return `<rect x="${x1}" y="${y}" width="${x2 - x1}" height="8" rx="3" fill="${C.eq}"/>` + ln([(x1 + x2) / 2, y + 8], [(x1 + x2) / 2, 182], C.eq, 4) + (bx != null ? ln([bx, by1], [bx - 6, by2], C.eq, 7) : ""); }
      if (k === "cable") { const f = at(a[0]), t = at(a[1]); return ci(f, 5, "none", `stroke="${C.eq2}" stroke-width="2"`) + ln(f, t, C.eq2, 1.3); }
      if (k === "post") { const [x, y1, y2] = a; return ln([x, y1], [x, y2], C.eq, 5); }
      if (k === "mat") { const [x1, x2] = a; return `<rect x="${x1}" y="180" width="${x2 - x1}" height="4" rx="2" fill="${C.top}" opacity=".45"/>`; }
      if (k === "pad") { const p = at(a[0]); return ci(add(p, a[1] || [0, 0]), 6, C.eq); }
      if (k === "plat") { const p = at(a[0]); const ang = a[1]; const d = v(ang), n = v(ang + 90); const c = add(p, n, a[2] || 5); return ln(add(c, d, -22), add(c, d, 22), C.eq, 6); }
      if (k === "line") { const [p1, p2, w] = a; return ln(p1, p2, C.eq, w || 7); }
      if (k === "bar2") { const p = at(a[0]); return ln(add(p, [-4, 0]), add(p, [4, 0]), C.eq2, 6); }
      return "";
    }).join("");
  }
  let UID = 0;
  const P = q => `${q[0].toFixed(1)},${q[1].toFixed(1)}`;
  const nrm = q => { const l = Math.hypot(q[0], q[1]) || 1; return [q[0] / l, q[1] / l]; };
  // caminho afunilado entre dois pontos (membros), com leve curva de músculo
  function segD(a, b, wa, wb, opt = {}) {
    const d = nrm(sub(b, a)); const n = [-d[1], d[0]];
    const ba = opt.bulge || 0, side = opt.side || [0, 0];
    const bS = (n[0] * side[0] + n[1] * side[1]) >= 0 ? 1 : -1;
    const m = add(a, sub(b, a), .42), wm = (wa + wb) / 2;
    const L1 = add(a, n, wa / 2), L2 = add(b, n, wb / 2), R1 = add(a, n, -wa / 2), R2 = add(b, n, -wb / 2);
    const cL = add(m, n, wm / 2 + (bS > 0 ? ba : ba * .35)), cR = add(m, n, -(wm / 2 + (bS < 0 ? ba : ba * .35)));
    return `M${P(L1)} Q${P(cL)} ${P(L2)} A${(wb / 2).toFixed(1)},${(wb / 2).toFixed(1)} 0 0 1 ${P(R2)} Q${P(cR)} ${P(R1)} A${(wa / 2).toFixed(1)},${(wa / 2).toFixed(1)} 0 0 1 ${P(L1)}Z`;
  }
  function spline(pts) {
    const n = pts.length; let d = `M${P(pts[0])}`;
    for (let i = 0; i < n; i++) { const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const c1 = add(p1, sub(p2, p0), 1 / 6), c2 = add(p2, sub(p3, p1), -1 / 6); d += ` C${P(c1)} ${P(c2)} ${P(p2)}`; }
    return d + "Z";
  }
  // estilo cartoon: contorno escuro desenhado por baixo, preenchimento por cima
  const OUT = "#33222b", SK = "#f3c7a8", SK2 = "#dfa384", HAIR = "#7c2619", HAIR2 = "#a8452d", ROXO = "#26222a", ROXO2 = "#3a3540", TEE = "#fbf8fc", TEE2 = "#e6dfe9", STRIPE = "#3a3540", SHOE = "#ffffff", SOLE = "#d8d2dc", LACE = "#e9e3ee";
  const sh = (d, fill, extra = "") => ({ d, fill, extra });
  const el = (tag, attrs, fill) => ({ tag, attrs, fill });
  const SHADE = { [SK]: "#e2b293", [ROXO]: "#1c191f", [SHOE]: "#ebe6ee", [SOLE]: "#bfb6c6", [TEE]: "#e8e1ec" };
  function paint(parts, far) {
    const op = "";
    const one = (q, mode) => {
      const fill = far ? (SHADE[q.fill] || q.fill) : q.fill;
      const common = mode === "o" ? `fill="${OUT}" stroke="${OUT}" stroke-width="2" stroke-linejoin="round"` : `fill="${fill}"`;
      if (q.tag) return `<${q.tag} ${q.attrs} ${common}/>`;
      return `<path d="${q.d}" ${common}${q.extra ? " " + q.extra : ""}/>`;
    };
    return `<g${op}>${parts.map(q => one(q, "o")).join("")}${parts.map(q => one(q, "f")).join("")}</g>`;
  }
  function draw(p, opts = {}) {
    const J = solve(p); const id = "f" + (++UID);
    const u = J.tv, b = nrm(J.back), f = [-b[0], -b[1]], H = J.hip, S = J.sh;
    const at = (s, side, w) => add(add(H, u, L.torso * s), side, w);
    const torsoPts = [at(1.02, b, 4.4), at(.86, b, 6.6), at(.62, b, 5.6), at(.44, b, 4.8), at(.24, b, 8), at(.08, b, 10.6), at(-.1, b, 8.6), at(-.2, b, 3),
      at(-.17, f, 3.6), at(-.04, f, 6.2), at(.2, f, 6.6), at(.44, f, 5), at(.6, f, 6.2), at(.71, f, 9.6), at(.82, f, 8.4), at(.97, f, 5.2), at(1.08, f, .6)];
    const torsoD = spline(torsoPts);
    const band = (s0, s1, c) => { const w = 40; const pts = [at(s0, b, w), at(s1, b, w), at(s1, f, w), at(s0, f, w)]; return `<path d="M${pts.map(P).join(" L")}Z" fill="${c}"/>`; };
    // legging com cós mais alto e top
    const torsoSVG = `<clipPath id="${id}"><path d="${torsoD}"/></clipPath>${paint([sh(torsoD, SK)])}<g clip-path="url(#${id})">${band(-.4, .4, ROXO)}${band(.4, 1.3, TEE)}
      <path d="M${P(at(.42, f, 12))} L${P(at(.42, b, 12))}" stroke="${TEE2}" stroke-width="1.4"/>
      <path d="M${P(at(1.0, f, 5))} Q${P(at(.9, f, 2))} ${P(at(.92, b, 1))}" fill="none" stroke="#d9a441" stroke-width=".8"/></g>
      <path d="${torsoD}" fill="none" stroke="${OUT}" stroke-width="1.2"/>`;
    // cabeça
    const hv = v(J.hd); const hb0 = [hv[1], -hv[0]]; const hb = p.flip ? [-hb0[0], -hb0[1]] : hb0; const hf = [-hb[0], -hb[1]];
    const neckTop = add(S, hv, L.neck + 1.6); const hc = add(S, hv, L.neck + 9);
    const ang = Math.atan2(hv[1], hv[0]) * 180 / Math.PI;
    const ellA = (c, rx, ry) => `cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${rx}" ry="${ry}" transform="rotate(${(ang + 90).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)})"`;
    const knot = add(add(hc, hv, 7.4), hb, 5.8);
    // rabo de cavalo: curva cheia caindo para trás
    const pA = add(knot, hv, 2.4), pB = add(add(knot, hb, 11), hv, -4), pC = add(add(knot, hb, 9), hv, -19), pD = add(add(knot, hb, 3.6), hv, -8);
    const ponyD = `M${P(pA)} Q${P(add(add(knot, hb, 10), hv, 4))} ${P(pB)} Q${P(add(add(knot, hb, 13), hv, -13))} ${P(pC)} Q${P(add(add(knot, hb, 5), hv, -12))} ${P(pD)} Q${P(add(knot, hb, 1))} ${P(add(knot, hv, -2.4))}Z`;
    const strandD = `M${P(add(add(hc, hb, 4), hv, -4))} Q${P(add(add(hc, hb, 8), hv, -9))} ${P(add(add(hc, hb, 6), hv, -16))} Q${P(add(add(hc, hb, 3), hv, -10))} ${P(add(add(hc, hb, 2), hv, -5))}Z`;
    const hairBack = el("ellipse", ellA(add(hc, hb, 1.4), 8.6, 10.2), HAIR);
    const face = el("ellipse", ellA(add(add(hc, hf, 1.6), hv, -.9), 7.3, 9.1), SK);

  } catch (e) { /* o registro de acesso é opcional: nunca bloqueia o app */ }
}

// =================== finanças: regras ===================
function mesFatura(cartao, dataISO) {
  const m = dataISO.slice(0, 7), d = +dataISO.slice(8);
  const F = +cartao.fechamento || 1, V = +cartao.vencimento || 10;
  const fechaEm = d < F ? m : addMes(m, 1);
  return V > F ? fechaEm : addMes(fechaEm, 1);
}
const cartaoDe = id => D.cartoes.find(c => c.id === id);
const fatDoc = (cid, m) => D.faturas.find(f => f.id === `${cid}_${m}`);
const fatPaga = (cid, m) => !!(fatDoc(cid, m) || {}).pago;
const lancPago = l => l.cartaoId ? fatPaga(l.cartaoId, l.mes) : !!l.pago;
function faturasDoMes(m) {
  return D.cartoes.map(c => {
    const itens = D.lanc.filter(l => l.cartaoId === c.id && l.mes === m && l.tipo === "saida");
    const total = itens.reduce((s, l) => s + (+l.valor || 0), 0);
    return { c, m, itens, total, venc: diaEm(m, c.vencimento), pago: fatPaga(c.id, m) };
  }).filter(f => f.total > 0 || f.pago);
}
function resumo(m) {
  const L = D.lanc.filter(l => l.mes === m);
  const ent = L.filter(l => l.tipo === "entrada");
  const sai = L.filter(l => l.tipo === "saida" && !l.cartaoId);
  const fats = faturasDoMes(m);
  const entPrev = ent.reduce((s, l) => s + (+l.valor || 0), 0);
  const entRec = ent.filter(l => l.pago).reduce((s, l) => s + (+l.valor || 0), 0);
  const saiPrev = sai.reduce((s, l) => s + (+l.valor || 0), 0) + fats.reduce((s, f) => s + f.total, 0);
  const saiPago = sai.filter(l => l.pago).reduce((s, l) => s + (+l.valor || 0), 0) + fats.filter(f => f.pago).reduce((s, f) => s + f.total, 0);
  return { entPrev, entRec, saiPrev, saiPago, saldo: entRec - saiPago, previsao: entPrev - saiPrev, ent, sai, fats };
}
function contasDoMes(m) {
  const r = resumo(m);
  const contas = [
    ...r.sai.map(l => ({ k: "lanc", id: l.id, desc: l.desc, valor: +l.valor || 0, venc: l.venc || l.data, pago: !!l.pago, cat: l.cat, fixa: !!l.recId, parc: l.parc })),
    ...r.fats.map(f => ({ k: "fat", id: `${f.c.id}_${m}`, cid: f.c.id, desc: `Fatura ${f.c.nome}`, valor: f.total, venc: f.venc, pago: f.pago, cat: "Cartão" })),
  ];
  return contas.map(c => ({ ...c, st: c.pago ? "paga" : (c.venc && c.venc < hoje() ? "vencida" : "pendente") })).sort((a, b) => (a.venc || "").localeCompare(b.venc || ""));
}
function proximasContas() {
  const m = mesAtual();
  return [...contasDoMes(addMes(m, -1)), ...contasDoMes(m), ...contasDoMes(addMes(m, 1))]
    .filter(c => !c.pago && c.venc && diasAte(c.venc) <= 15).sort((a, b) => a.venc.localeCompare(b.venc));
}
const tagConta = st => st === "paga" ? `<span class="tag ok">${ic("check")}Paga</span>` : st === "vencida" ? `<span class="tag bad">Vencida</span>` : `<span class="tag warn">Pendente</span>`;

async function gerarRecorrentes() {
  if (!READY.has("lanc") || !READY.has("rec")) return;
  const limite = addMes(mesAtual(), 2);
  const meses = [...new Set([mesAtual(), S.mes].filter(m => m <= limite && m >= addMes(mesAtual(), -1)))];
  for (const r of D.rec) {
    if (r.ativo === false) continue;
    for (const g of meses) {
      if (r.desde && g < r.desde) continue; if (r.ate && g > r.ate) continue;
      if ((r.pulados || []).includes(g)) continue;
      const id = `r_${r.id}_${g}`; if (S.gerados.has(id) || D.lanc.some(l => l.id === id)) continue;
      S.gerados.add(id);
      try {
        const ref = col("lanc").doc(id); const ex = await ref.get(); if (ex.exists) continue;
        const data = diaEm(g, r.dia); const c = r.cartaoId ? cartaoDe(r.cartaoId) : null;
        await ref.set({ tipo: r.tipo, desc: r.desc, valor: +r.valor || 0, cat: r.cat, data, venc: data, mes: c ? mesFatura(c, data) : g, pago: false, recId: r.id, cartaoId: r.cartaoId || null, criadoEm: Date.now() });
      } catch (e) { S.gerados.delete(id); }
    }
  }
}

function graficoCat(lista) {
  const max = Math.max(...lista.map(x => x[1]), 1); const tot = lista.reduce((s, x) => s + x[1], 0);
  return lista.map(([c, v]) => `<div class="hbar" data-tip="${esc(c)}: ${esc(brl(v))} (${Math.round(v / tot * 100)}%)"><span>${esc(c)}</span><div class="track"><i style="width:${Math.max(2, v / max * 100)}%"></i></div><span class="val">${brl0(v)}</span></div>`).join("");
}
function graficoMeses(meses) {
  const dados = meses.map(m => { const r = resumo(m); return { m, e: r.entPrev, s: r.saiPrev }; });
  const max = Math.max(1, ...dados.flatMap(d => [d.e, d.s]));
  const W = 640, H = 230, pl = 52, pb = 28, pt = 16, gw = (W - pl - 10) / dados.length, bw = Math.min(26, gw / 2 - 6);
  const y = v => pt + (H - pt - pb) * (1 - v / max);

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Entradas e saídas dos últimos meses">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - 10}" y1="${y(t)}" y2="${y(t)}" stroke="#ece3da"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#7f707d">${brl0(t).replace("R$", "").trim()}</text>`).join("")}
    ${dados.map((d, i) => { const x0 = pl + i * gw + gw / 2 - bw - 1; const bar = (x, v, c, lbl) => { const h = Math.max(0, H - pb - y(v)); return v > 0 ? `<path d="M${x},${H - pb} v${-(h - 4)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${h - 4} z" fill="${c}" data-tip="${lbl} ${nomeMes(d.m)}: ${brl(v)}"/>` : ""; };
      return `${bar(x0, d.e, "#7f3b75", "Entradas")}${bar(x0 + bw + 2, d.s, "#d9737f", "Saídas")}<text x="${pl + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#7f707d">${MES_C[+d.m.slice(5) - 1]}</text>`; }).join("")}
  </svg><div class="legend" style="margin-top:6px"><span><i style="background:#7f3b75"></i>Entradas</span><span><i style="background:#d9737f"></i>Saídas</span></div>`;
}

function animar(x) {
  cancelAnimationFrame(S.raf);

    let k = ph < .9 ? 0 : ph < 2 ? (ph - .9) / 1.1 : ph < 3.1 ? 1 : 1 - (ph - 3.1) / .5;
    k = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    box.innerHTML = FIG.draw(FIG.mix(x.A, x.B, k), { vb: FIG.vbPoses(x.A, x.B) });
    const a = document.getElementById("etA"), bb = document.getElementById("etB"); if (a && bb) { a.classList.toggle("on", k < .5); bb.classList.toggle("on", k >= .5); }
    S.raf = requestAnimationFrame(loop);

}

function cicloInfo() {
  const cs = [...(D.ciclos || [])].filter(c => c.inicio).sort((a, b) => a.inicio.localeCompare(b.inicio));
  const diff = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 86400000);
  const lens = []; for (let i = 1; i < cs.length; i++) { const d = diff(cs[i - 1].inicio, cs[i].inicio); if (d >= 18 && d <= 60) lens.push(d); }
  const durs = cs.filter(c => c.fim).map(c => diff(c.inicio, c.fim) + 1).filter(d => d > 0 && d <= 12);
  const ultimos = lens.slice(-6);
  const media = ultimos.length ? Math.round(ultimos.reduce((a, b) => a + b, 0) / ultimos.length) : (+D.prefs.cicloPadrao || 28);
  const durMedia = durs.length ? Math.round(durs.slice(-6).reduce((a, b) => a + b, 0) / Math.min(6, durs.length)) : (+D.prefs.duracaoPadrao || 5);
  const ult = cs[cs.length - 1];
  if (!ult) return { cs, media, durMedia, vazio: true };
  const hj = hoje();
  const fimUlt = ult.fim || somaDias(ult.inicio, durMedia - 1);
  const menstruada = hj >= ult.inicio && hj <= fimUlt && (ult.fim || diff(ult.inicio, hj) < 10);
  const proxima = somaDias(ult.inicio, media);
  const diaCiclo = diff(ult.inicio, hj) + 1;
  const atraso = Math.max(0, diff(proxima, hj));
  const faltam = diff(hj, proxima);
  const variacao = ultimos.length >= 2 ? Math.max(...ultimos) - Math.min(...ultimos) : null;
  return { cs, ult, media, durMedia, proxima, diaCiclo, atraso, faltam, menstruada, fimUlt, variacao, lens: ultimos, regist: lens.length };
}
function diasMenstruacao() {
  const set = new Set(); const ci = cicloInfo();
  (D.ciclos || []).forEach(c => { if (!c.inicio) return; const fim = c.fim || (c === ci.ult ? (hoje() < ci.fimUlt ? hoje() : ci.fimUlt) : somaDias(c.inicio, ci.durMedia - 1)); for (let d = c.inicio; d <= fim; d = somaDias(d, 1)) set.add(d); });
  return set;
}

function barras(dados, cor, fmt) {

    ${dados.map((d, i) => { const x = pl + i * gw + gw / 2 - bw / 2; const h = Math.max(0, H - pb - y(d.v)); return `${d.v > 0 ? `<path d="M${x},${H - pb} v${-Math.max(0, h - 4)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${Math.max(0, h - 4)} z" fill="${cor}" data-tip="${esc(d.tip)}"/>` : ""}<text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="12" fill="#7f707d">${d.lbl}</text>${d.v > 0 ? `<text x="${x + bw / 2}" y="${y(d.v) - 5}" text-anchor="middle" font-size="11" fill="#2f2230">${fmt(d.v)}</text>` : ""}`; }).join("")}</svg>`;

function lerSessao() { if (S.logado) return true; for (const st of ["localStorage", "sessionStorage"]) { try { const v = JSON.parse(window[st].getItem(SESSAO()) || "null"); if (v && v.ate > Date.now() && D.prefs.login && v.u === D.prefs.login.usuario) { S.logado = true; return true; } } catch {} } return false; }
function gravarSessao(manter) { S.logado = true; const v = JSON.stringify({ u: D.prefs.login.usuario, ate: Date.now() + (manter ? 60 : 1) * 86400000 }); try { (manter ? localStorage : sessionStorage).setItem(SESSAO(), v); } catch {} }

async function hashSenha(senha, sal) {
  if (!(window.crypto && crypto.subtle)) throw new Error("sem-crypto");
  const enc = new TextEncoder(); const k = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(sal), iterations: 150000, hash: "SHA-256" }, k, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function carregarMestre() {

  try { const snap = await S.db.collection("membros").get(); S.mestre = snap.docs.map(d => ({ id: d.id, ...d.data() })); } catch { S.mestre = []; }
  S.nomesMestre = {}; try { const ps = await S.user.profiles(S.mestre.map(m => m.id)); S.mestre.forEach(m => { if (ps && ps[m.id] && ps[m.id].name) S.nomesMestre[m.id] = ps[m.id].name; }); } catch {}
  render();
}

  if (e.target.id === "comidaBusca") { S.comidaQ = e.target.value; const r = $("#comidaRes"); if (r) r.innerHTML = resultadosComida(); } const q = e.target.closest("#libBusca"); if (q) { S.libQ = q.value; render(); const i2 = $("#libBusca"); if (i2) { i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); } }
  const fb = e.target.closest("#fxBusca"); if (fb) { S.fxGrupo = null; document.querySelectorAll('[data-act="fxGrupo"]').forEach(c => c.classList.remove("on")); const r = $("#fxRes"); if (r) { r.innerHTML = fxResultados(fb.value, null); r.style.display = r.innerHTML ? "" : "none"; } } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && ["novoCl", "orcVal", "lnkU"].includes(e.target.id)) { const b = e.target.closest(".row").querySelector("button"); if (b) b.click(); } if (e.key === "Escape") fechar(); });
$("#mbg").addEventListener("click", e => { if (e.target.id === "mbg") fechar(); });
document.addEventListener("click", e => { const r = $("#fxRes"); if (r && !e.target.closest("#modal")) r.style.display = "none"; });
// dica (tooltip) dos gráficos
document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); const tip = $("#tip"); if (t) { tip.textContent = t.dataset.tip; tip.style.opacity = 1; } else tip.style.opacity = 0; });
document.addEventListener("mousemove", e => { const tip = $("#tip"); if (tip.style.opacity === "1") { tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 12) + "px"; tip.style.top = (e.clientY - 34) + "px"; } });

init();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => { r.addEventListener("updatefound", () => { const w = r.installing; w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) { try { toast("Nova versão do em dia. pronta: feche e abra o app ✿"); } catch {} } }); }); }).catch(() => {}));</script>
